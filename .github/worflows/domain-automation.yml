name: Domain Automation

on:
  issue_comment:
    types: [created]

jobs:
  process-domain:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[도메인 신청]') &&
      (contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/reject'))
    
    steps:
      - name: Check if commenter has permission
        id: check_permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data: collaborators } = await github.rest.repos.listCollaborators({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const hasPermission = collaborators.some(c => c.login === context.payload.comment.user.login);
            
            if (!hasPermission && context.payload.comment.user.login !== context.repo.owner) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 권한이 없습니다. 저장소 관리자만 승인/거부할 수 있습니다.'
              });
              core.setFailed('No permission');
              return;
            }

      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            const title = context.payload.issue.title;
            
            // 도메인 이름 추출
            const domainMatch = title.match(/\[도메인 신청\]\s*(\S+)/);
            const fullDomain = domainMatch ? domainMatch[1] : null;
            
            // 네임서버 추출
            const ns1Match = body.match(/네임서버 1[*:]\s*[*]+\s*(\S+)/);
            const ns2Match = body.match(/네임서버 2[*:]\s*[*]+\s*(\S+)/);
            
            const ns1 = ns1Match ? ns1Match[1] : null;
            const ns2 = ns2Match ? ns2Match[1] : null;
            
            // 이메일 추출
            const emailMatch = body.match(/이메일[*:]\s*[*]+\s*(\S+)/);
            const email = emailMatch ? emailMatch[1] : null;
            
            if (!fullDomain || !ns1 || !ns2) {
              core.setFailed('도메인 정보를 파싱할 수 없습니다.');
              return;
            }
            
            // 서브도메인 추출 (확장자 제거)
            const subdomain = fullDomain.split('.')[0];
            
            core.setOutput('full_domain', fullDomain);
            core.setOutput('subdomain', subdomain);
            core.setOutput('ns1', ns1);
            core.setOutput('ns2', ns2);
            core.setOutput('email', email);

      - name: Approve and create DNS records
        if: contains(github.event.comment.body, '/approve')
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        with:
          script: |
            const subdomain = '${{ steps.parse.outputs.subdomain }}';
            const fullDomain = '${{ steps.parse.outputs.full_domain }}';
            const ns1 = '${{ steps.parse.outputs.ns1 }}';
            const ns2 = '${{ steps.parse.outputs.ns2 }}';
            
            // Cloudflare API를 사용하여 NS 레코드 생성
            const createDNSRecord = async (nameserver) => {
              const response = await fetch(
                `https://api.cloudflare.com/client/v4/zones/${process.env.CLOUDFLARE_ZONE_ID}/dns_records`,
                {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    type: 'NS',
                    name: subdomain,
                    content: nameserver,
                    ttl: 3600,
                  }),
                }
              );
              
              const data = await response.json();
              if (!data.success) {
                throw new Error(`DNS 레코드 생성 실패: ${JSON.stringify(data.errors)}`);
              }
              return data;
            };
            
            try {
              // NS 레코드 2개 생성
              await createDNSRecord(ns1);
              await createDNSRecord(ns2);
              
              // 성공 코멘트
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **도메인이 성공적으로 발급되었습니다!**
                
**도메인**: \`${fullDomain}\`
**네임서버**: 
- ${ns1}
- ${ns2}

DNS 전파까지 최대 24-48시간이 소요될 수 있습니다.
                
도메인은 무제한으로 사용 가능하며, 네임서버 변경이 필요한 경우 새로운 Issue를 생성해주세요.`
              });
              
              // Issue 닫기
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['approved', 'completed']
              });
              
            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ DNS 레코드 생성 중 오류가 발생했습니다.\n\n\`\`\`\n${error.message}\n\`\`\``
              });
              core.setFailed(error.message);
            }

      - name: Reject application
        if: contains(github.event.comment.body, '/reject')
        uses: actions/github-script@v7
        with:
          script: |
            const fullDomain = '${{ steps.parse.outputs.full_domain }}';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **도메인 신청이 거부되었습니다.**
              
**도메인**: \`${fullDomain}\`

거부 사유는 위의 코멘트를 참고해주세요.`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['rejected']
            });
